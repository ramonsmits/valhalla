name: Publish Docker image

on:
  push:
    branches:
      - downstream
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "test/**"
      - "test_requests/**"
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/valhalla
  SCRIPTED_IMAGE: ghcr.io/${{ github.repository_owner }}/valhalla-scripted

jobs:
  build-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the base image (Valhalla binaries) first
      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          provenance: false
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.BASE_IMAGE }}:downstream
            ${{ env.BASE_IMAGE }}:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=valhalla-base
          cache-to: type=gha,mode=max,scope=valhalla-base
          build-args: |
            VERSION_MODIFIER=${{ steps.sha.outputs.short }}

      # Build scripted image on top of base
      - name: Build and push scripted image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile-scripted
          provenance: false
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.SCRIPTED_IMAGE }}:downstream
            ${{ env.SCRIPTED_IMAGE }}:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=valhalla-scripted
          cache-to: type=gha,mode=max,scope=valhalla-scripted
          build-args: |
            VALHALLA_BUILDER_IMAGE=${{ env.BASE_IMAGE }}:sha-${{ steps.sha.outputs.short }}
